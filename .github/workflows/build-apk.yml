name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Write app/google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          raw = os.environ.get("GOOGLE_SERVICES_JSON", "")
          target = os.path.join("app", "google-services.json")
          os.makedirs("app", exist_ok=True)

          cleaned = raw.lstrip("\ufeff").strip()
          if not cleaned:
            if os.path.exists(target):
              print("GOOGLE_SERVICES_JSON secret is empty; using existing app/google-services.json.")
            else:
              print("::warning::GOOGLE_SERVICES_JSON secret is not set; building without Firebase config.")
            sys.exit(0)

          json_text = None
          if cleaned.startswith("{"):
            json_text = cleaned
          else:
            try:
              compact = "".join(cleaned.split())
              compact += "=" * (-len(compact) % 4)
              try:
                raw_bytes = base64.b64decode(compact, validate=True)
              except Exception:
                raw_bytes = base64.urlsafe_b64decode(compact)
              decoded = raw_bytes.decode("utf-8").lstrip("\ufeff").strip()
              if decoded.startswith("{"):
                json_text = decoded
            except Exception as exc:
              print(f"::error::Failed to decode GOOGLE_SERVICES_JSON secret: {exc}")
              sys.exit(1)

          if not json_text:
            print("::error::GOOGLE_SERVICES_JSON secret is neither valid JSON nor Base64-encoded JSON.")
            sys.exit(1)

          try:
            parsed = json.loads(json_text)
          except json.JSONDecodeError as exc:
            print(f"::error::GOOGLE_SERVICES_JSON does not contain valid JSON: {exc}")
            sys.exit(1)

          if not isinstance(parsed, dict) or "project_info" not in parsed or "client" not in parsed:
            print("::error::GOOGLE_SERVICES_JSON is missing required Firebase fields ('project_info' or 'client').")
            sys.exit(1)

          with open(target, "w", encoding="utf-8", newline="\n") as f:
            json.dump(parsed, f, indent=2)
            f.write("\n")

          clients = parsed.get("client") or []
          matching_clients = [
            c for c in clients
            if (c.get("client_info") or {}).get("android_client_info", {}).get("package_name") == "com.aistudio.shillachat.qmkxrp"
          ]
          if not matching_clients:
            print("::warning::app/google-services.json has no Android client for package com.aistudio.shillachat.qmkxrp; default_web_client_id will be empty.")
          else:
            has_web_client = any(
              o.get("client_type") == 3
              for c in matching_clients
              for o in (
                (c.get("oauth_client") or []) +
                (((c.get("services") or {}).get("appinvite_service") or {}).get("other_platform_oauth_client") or [])
              )
            )
            if not has_web_client:
              print("::warning::app/google-services.json is missing a Web OAuth client (client_type=3). Enable Google Sign-In in Firebase Auth and re-download google-services.json so default_web_client_id is generated.")

          print("Successfully wrote and validated app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          PY

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shilitna-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
